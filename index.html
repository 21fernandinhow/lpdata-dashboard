<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Dashboard do LPData: edite o conteúdo e os assets das suas landing pages."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/Inter-latin.woff2" />
    <title>LPData Dashboard</title>
    <script>
      // Aplica o tema antes da primeira pintura, para não piscar o tema errado.
      ;(function () {
        var theme
        try {
          theme = localStorage.getItem("lpdata-theme")
        } catch (e) {}
        if (theme !== "light" && theme !== "dark") {
          theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"
        }
        document.documentElement.dataset.theme = theme
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
